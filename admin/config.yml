backend:
  name: github
  repo: juniorlocogithub/juniorloco
  branch: main
  base_url: https://api.netlify.com # Lo cambiaremos al worker o auth provider
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Publicaciones"
    folder: "content"
    create: true
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Contenido", name: "body", widget: "markdown"}
