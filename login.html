<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - JNRCloud.lat Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Cloudflare Turnstile SDK para CAPTCHA -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-700">
        <h1 id="form-title" class="text-2xl font-bold text-center mb-6 text-blue-400">Iniciar Sesión</h1>

        <!-- Mensaje de alerta para errores o éxitos -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <form id="auth-form" class="space-y-4">
            <!-- Campos exclusivos para Registro (Username y Avatar) -->
            <div id="register-fields" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Nombre de usuario (Nickname)</label>
                    <input type="text" id="username" placeholder="Tu apodo o nombre" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Elige tu icono de perfil</label>
                    <div class="flex justify-around gap-2" id="avatar-selector">
                        <label class="cursor-pointer p-2 bg-gray-700 rounded-xl border-2 border-transparent hover:border-blue-500 transition text-2xl flex items-center justify-center">
                            <input type="radio" name="avatar" value="🚀" class="hidden" checked> 🚀
                        </label>
                        <label class="cursor-pointer p-2 bg-gray-700 rounded-xl border-2 border-transparent hover:border-blue-500 transition text-2xl flex items-center justify-center">
                            <input type="radio" name="avatar" value="💻" class="hidden"> 💻
                        </label>
                        <label class="cursor-pointer p-2 bg-gray-700 rounded-xl border-2 border-transparent hover:border-blue-500 transition text-2xl flex items-center justify-center">
                            <input type="radio" name="avatar" value="⚡" class="hidden"> ⚡
                        </label>
                        <label class="cursor-pointer p-2 bg-gray-700 rounded-xl border-2 border-transparent hover:border-blue-500 transition text-2xl flex items-center justify-center">
                            <input type="radio" name="avatar" value="🛡️" class="hidden"> 🛡️
                        </label>
                        <label class="cursor-pointer p-2 bg-gray-700 rounded-xl border-2 border-transparent hover:border-blue-500 transition text-2xl flex items-center justify-center">
                            <input type="radio" name="avatar" value="🦊" class="hidden"> 🦊
                        </label>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tu@correo.com" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- Widget CAPTCHA (Turnstile) visible únicamente en Registro -->
            <div id="captcha-container" class="hidden flex justify-center my-2">
                <!-- Nota: Si quieres probar de inmediato sin registrarte en Cloudflare, usa la clave de prueba: 1x00000000000000000000AA -->
                <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                Entrar
            </button>
        </form>

        <div class="text-center mt-4">
            <button id="toggle-mode" type="button" class="text-sm text-blue-400 hover:underline focus:outline-none">
                ¿No tienes cuenta? Regístrate aquí
            </button>
        </div>

        <div class="text-center mt-6 border-t border-gray-700 pt-4">
            <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">← Volver al inicio</a>
        </div>
    </div>

    <script>
        // Credenciales de Supabase heredadas de tu configuración
        const SUPABASE_URL = 'https://wvqpofhgzhjoiwvpqihp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TVIraqS4yq1Uk-sgXEqk8Q_mDdggToO';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;

        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeBtn = document.getElementById('toggle-mode');
        const authForm = document.getElementById('auth-form');
        const alertBox = document.getElementById('alert-box');
        const registerFields = document.getElementById('register-fields');
        const captchaContainer = document.getElementById('captcha-container');

        // Selección visual de los avatares predeterminados
        document.querySelectorAll('#avatar-selector label').forEach(label => {
            label.addEventListener('click', () => {
                document.querySelectorAll('#avatar-selector label').forEach(l => l.classList.remove('border-blue-500', 'bg-gray-600'));
                label.classList.add('border-blue-500', 'bg-gray-600');
                label.querySelector('input').checked = true;
            });
        });
        document.querySelector('#avatar-selector label').classList.add('border-blue-500', 'bg-gray-600');

        // Cambiar entre Iniciar Sesión y Registrarse
        toggleModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'Iniciar Sesión';
                submitBtn.textContent = 'Entrar';
                toggleModeBtn.textContent = '¿No tienes cuenta? Regístrate aquí';
                registerFields.classList.add('hidden');
                captchaContainer.classList.add('hidden');
                document.getElementById('username').removeAttribute('required');
            } else {
                formTitle.textContent = 'Crear Cuenta';
                submitBtn.textContent = 'Registrarse';
                toggleModeBtn.textContent = '¿Ya tienes cuenta? Inicia sesión';
                registerFields.classList.remove('hidden');
                captchaContainer.classList.remove('hidden');
                document.getElementById('username').setAttribute('required', 'true');
            }
            alertBox.classList.add('hidden');
        });

        // Manejar el envío del formulario
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';

            try {
                if (isLoginMode) {
                    // Iniciar sesión
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    
                    showAlert('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    // Registrarse con Username, Avatar y Captcha
                    const username = document.getElementById('username').value.trim();
                    const selectedAvatar = document.querySelector('input[name="avatar"]:checked').value;
                    
                    let captchaToken = undefined;
                    try {
                        captchaToken = turnstile.getResponse();
                    } catch (err) {
                        console.log('Turnstile no requerido o no cargado');
                    }

                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                username: username,
                                avatar: selectedAvatar
                            },
                            captchaToken: captchaToken
                        }
                    });
                    if (error) throw error;

                    showAlert('¡Registro exitoso! Ya puedes iniciar sesión.', 'success');
                    isLoginMode = true;
                    formTitle.textContent = 'Iniciar Sesión';
                    submitBtn.textContent = 'Entrar';
                    toggleModeBtn.textContent = '¿No tienes cuenta? Regístrate aquí';
                    registerFields.classList.add('hidden');
                    captchaContainer.classList.add('hidden');
                }
            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                if (isLoginMode) submitBtn.textContent = 'Entrar';
                else submitBtn.textContent = 'Registrarse';
            }
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-900', 'text-red-200', 'bg-green-900', 'text-green-200');
            if (type === 'error') {
                alertBox.classList.add('bg-red-900', 'text-red-200');
            } else {
                alertBox.classList.add('bg-green-900', 'text-green-200');
            }
        }
    </script>
</body>
</html>
