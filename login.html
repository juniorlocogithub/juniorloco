<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Mi Sitio Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Iniciar Sesión</h2>
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <input type="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="tu@correo.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold">Entrar</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            ¿No tienes cuenta? <a href="#" class="text-blue-600 hover:underline">Regístrate aquí</a>
        </p>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-600 hover:text-blue-600">&larr; Volver al inicio</a>
        </div>
    </div>
</body>
</html>
