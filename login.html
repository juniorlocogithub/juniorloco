<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Mi Sitio Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 max-w-md w-full">
        <h2 id="form-title" class="text-2xl font-bold text-center text-blue-600 mb-6">Iniciar Sesión</h2>
        
        <div id="message" class="mb-4 text-sm text-center font-medium"></div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="tu@correo.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold">Entrar</button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            <span id="toggle-text">¿No tienes cuenta?</span> 
            <button id="toggle-mode" type="button" class="text-blue-600 hover:underline font-semibold ml-1">Regístrate aquí</button>
        </p>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-600 hover:text-blue-600">&larr; Volver al inicio</a>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TUS CREDENCIALES DE SUPABASE
        const SUPABASE_URL = 'https://wvqpofhgzhiowvpqihp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TVIraqS4yq1Uk-sgXEqk8Q_mDdggToO';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeBtn = document.getElementById('toggle-mode');
        const toggleText = document.getElementById('toggle-text');
        const authForm = document.getElementById('auth-form');
        const messageDiv = document.getElementById('message');

        // Alternar entre Iniciar Sesión y Registro
        toggleModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'Iniciar Sesión';
                submitBtn.textContent = 'Entrar';
                toggleText.textContent = '¿No tienes cuenta?';
                toggleModeBtn.textContent = 'Regístrate aquí';
            } else {
                formTitle.textContent = 'Crear Cuenta';
                submitBtn.textContent = 'Registrarse';
                toggleText.textContent = '¿Ya tienes cuenta?';
                toggleModeBtn.textContent = 'Inicia sesión';
            }
            messageDiv.textContent = '';
        });

        // Manejar el formulario de autenticación
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            messageDiv.textContent = 'Procesando...';
            messageDiv.className = 'mb-4 text-sm text-center text-gray-600';

            if (isLoginMode) {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    messageDiv.textContent = error.message;
                    messageDiv.className = 'mb-4 text-sm text-center text-red-500';
                } else {
                    messageDiv.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                    messageDiv.className = 'mb-4 text-sm text-center text-green-600';
                    setTimeout(() => window.location.href = 'index.html', 1500);
                }
            } else {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    messageDiv.textContent = error.message;
                    messageDiv.className = 'mb-4 text-sm text-center text-red-500';
                } else {
                    messageDiv.textContent = '¡Registro exitoso! Ya puedes iniciar sesión.';
                    messageDiv.className = 'mb-4 text-sm text-center text-green-600';
                    isLoginMode = true;
                    formTitle.textContent = 'Iniciar Sesión';
                    submitBtn.textContent = 'Entrar';
                    toggleText.textContent = '¿No tienes cuenta?';
                    toggleModeBtn.textContent = 'Regístrate aquí';
                }
            }
        });
    </script>
</body>
</html>
