<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">MiSitioWeb</h1>
            <nav class="space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Inicio</a>
                <a href="login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Mi Cuenta</a>
            </nav>
        </div>
    </header>

    <!-- Anuncio Superior (Espacio para Google AdSense) -->
    <div class="max-w-6xl mx-auto px-4 my-4">
        <div class="bg-gray-200 border border-dashed border-gray-400 rounded-lg p-4 text-center text-gray-500 text-sm">
            [Espacio para Publicidad / Google AdSense]
        </div>
    </div>

    <!-- Contenido Principal (Actualizaciones Diarias) -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Contenedor dinámico donde se cargarán los artículos de Decap CMS -->
        <div id="posts-container" class="md:col-span-2 space-y-6">
            <article class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-gray-500">Cargando publicaciones...</p>
            </article>
        </div>

        <!-- Sidebar: Donaciones -->
        <aside class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center">
                <h3 class="font-bold text-lg mb-2">Apoya este proyecto</h3>
                <p class="text-sm text-gray-600 mb-4">Ayúdanos a mantener la página activa con una pequeña aportación.</p>
                <!-- Botón de PayPal de ejemplo -->
                <a href="https://www.paypal.com" target="_blank" class="inline-block bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold px-6 py-2 rounded-lg shadow-sm w-full">
                    Donar con PayPal
                </a>
            </div>
        </aside>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 MiSitioWeb. Todos los derechos reservados.</p>
    </footer>

    <!-- Script para cargar los archivos Markdown automáticamente desde GitHub -->
    <script>
      async function loadPosts() {
        // REEMPLAZA 'juniorloco/tu-repositorio' con tu usuario y el nombre exacto de tu repositorio de GitHub
        const repo = 'juniorlocogithub/juniorloco'; 
        const url = `https://api.github.com/repos/${repo}/contents/content`;
        
        try {
          const response = await fetch(url);
          const files = await response.json();
          
          const container = document.getElementById('posts-container');
          container.innerHTML = '';
          
          if (!Array.isArray(files) || files.length === 0) {
            container.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center"><p class="text-gray-500">No hay publicaciones todavía.</p></div>';
            return;
          }

          // Invertir para mostrar los más recientes primero
          files.reverse();

          for (const file of files) {
            if (file.name.endsWith('.md')) {
              const fileResponse = await fetch(file.download_url);
              const markdownText = await fileResponse.text();
              
              // Extraer el título del Frontmatter
              const titleMatch = markdownText.match(/title:\s*["']?([^"'\n]+)["']?/);
              const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '').replace(/-/g, ' ');
              
              // Extraer un pequeño fragmento del contenido (omitiendo el frontmatter)
              const contentWithoutFrontmatter = markdownText.replace(/^---[\s\S]*?---/, '').trim();
              const excerpt = contentWithoutFrontmatter.substring(0, 150) + (contentWithoutFrontmatter.length > 150 ? '...' : '');

              const postElement = document.createElement('article');
              postElement.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100';
              postElement.innerHTML = `
                <span class="text-xs text-blue-600 font-semibold uppercase">Publicación</span>
                <h2 class="text-2xl font-bold mt-1 mb-2 text-gray-900">${title}</h2>
                <p class="text-gray-600 mb-4">${excerpt || 'Contenido de la publicación...'}</p>
                <span class="text-xs text-gray-400">Actualizado recientemente</span>
              `;
              container.appendChild(postElement);
            }
          }
        } catch (error) {
          console.error('Error cargando las publicaciones:', error);
          document.getElementById('posts-container').innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center"><p class="text-red-500">Error al cargar las publicaciones.</p></div>';
        }
      }

      document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
