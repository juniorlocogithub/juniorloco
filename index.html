<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNRCloud.LAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">JNRCloud.LAT</h1>
            <nav id="nav-container" class="space-x-4 flex items-center">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Inicio</a>
                <a href="login.html" id="account-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Mi Cuenta</a>
            </nav>
        </div>
    </header>

    <!-- Anuncio Superior (Espacio para Google AdSense) -->
    <div class="max-w-6xl mx-auto px-4 my-4">
        <div class="bg-gray-200 border border-dashed border-gray-400 rounded-lg p-4 text-center text-gray-500 text-sm">
            [Espacio para Publicidad / Google AdSense]
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Contenedor dinámico de publicaciones o aviso de restricción -->
        <div id="posts-container" class="md:col-span-2 space-y-6">
            <article class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-gray-500">Verificando sesión...</p>
            </article>
        </div>

        <!-- Sidebar: Donaciones -->
        <aside class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center">
                <h3 class="font-bold text-lg mb-2">Apoya este proyecto</h3>
                <p class="text-sm text-gray-600 mb-4">Ayúdanos a mantener la página activa con una pequeña aportación.</p>
                <a href="https://www.paypal.com/donate?business=juniorloco@msn.com&currency_code=USD" target="_blank" class="inline-block bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold px-6 py-2 rounded-lg shadow-sm w-full text-center">
                Donar con PayPal
                </a>
            </div>
        </aside>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 JNRCloud. Todos los derechos reservados.</p>
    </footer>

    <!-- Script con validación de perfil, avatares y control de acceso -->
    <script>
        const SUPABASE_URL = 'https://wvqpofhgzhjoiwvpqihp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TVIraqS4yq1Uk-sgXEqk8Q_mDdggToO';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initApp() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const accountBtn = document.getElementById('account-btn');
                const navContainer = document.getElementById('nav-container');

                if (session && session.user) {
                    // Extraer los metadatos guardados en el registro (Nickname y Avatar)
                    const metadata = session.user.user_metadata || {};
                    const username = metadata.username || session.user.email.split('@')[0];
                    const avatar = metadata.avatar || '🚀';

                    if (accountBtn) accountBtn.remove();

                    // Mostrar el Avatar y el Nickname en la barra superior en lugar del correo
                    const profileDiv = document.createElement('div');
                    profileDiv.className = 'flex items-center space-x-2 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200';
                    profileDiv.innerHTML = `
                        <span class="text-xl">${avatar}</span>
                        <span class="text-sm font-semibold text-gray-700">${username}</span>
                    `;

                    const logoutBtn = document.createElement('button');
                    logoutBtn.className = 'bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition';
                    logoutBtn.textContent = 'Salir';
                    logoutBtn.onclick = async () => {
                        await supabaseClient.auth.signOut();
                        window.location.reload();
                    };

                    navContainer.appendChild(profileDiv);
                    navContainer.appendChild(logoutBtn);

                    // Si el usuario está registrado e inició sesión, se cargan las publicaciones completas
                    loadPosts();
                } else {
                    // Si NO ha iniciado sesión, se bloquea el contenido y se muestra el aviso
                    const container = document.getElementById('posts-container');
                    container.innerHTML = `
                        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center space-y-4">
                            <div class="text-5xl mb-2">🔒</div>
                            <h2 class="text-2xl font-bold text-gray-900">Contenido Exclusivo para Miembros</h2>
                            <p class="text-gray-600 text-sm max-w-md mx-auto">
                                Para ver las publicaciones completas, acceder a los enlaces y disfrutar de todo el contenido del sitio, debes iniciar sesión o registrarte.
                            </p>
                            <div class="pt-4 flex justify-center gap-4">
                                <a href="login.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow transition">
                                    Iniciar Sesión / Registrarse
                                </a>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Error al comprobar la sesión de Supabase:', err);
            }
        }

        async function loadPosts() {
            const repo = 'juniorlocogithub/juniorloco'; 
            const url = `https://api.github.com/repos/${repo}/contents/content`;
            
            try {
                const response = await fetch(url);
                const files = await response.json();
                
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                
                if (!Array.isArray(files) || files.length === 0) {
                    container.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center"><p class="text-gray-500">No hay publicaciones todavía.</p></div>';
                    return;
                }

                files.reverse();

                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        const fileResponse = await fetch(file.download_url);
                        const markdownText = await fileResponse.text();
                        
                        const titleMatch = markdownText.match(/title:\s*["']?([^"'\n]+)["']?/);
                        const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '').replace(/-/g, ' ');
                        
                        const contentWithoutFrontmatter = markdownText.replace(/^---[\s\S]*?---/, '').trim();
                        const excerpt = contentWithoutFrontmatter.substring(0, 150) + (contentWithoutFrontmatter.length > 150 ? '...' : '');

                        const postElement = document.createElement('article');
                        postElement.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-3';
                        postElement.innerHTML = `
                            <span class="text-xs text-blue-600 font-semibold uppercase tracking-wider">Publicación Exclusiva</span>
                            <h2 class="text-2xl font-bold text-gray-900">${title}</h2>
                            <p class="text-gray-600">${excerpt || 'Contenido de la publicación...'}</p>
                            <div class="pt-2 flex items-center justify-between border-t border-gray-100 text-xs text-gray-400">
                                <span>Acceso verificado</span>
                                <span class="text-blue-600 font-medium">Lectura completa y enlaces habilitados</span>
                            </div>
                        `;
                        container.appendChild(postElement);
                    }
                }
            } catch (error) {
                console.error('Error cargando las publicaciones:', error);
                document.getElementById('posts-container').innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center"><p class="text-red-500">Error al cargar las publicaciones.</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
